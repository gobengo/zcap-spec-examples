# Reusable (composite) action: build the website into a directory.
#
# Usage, after `actions/checkout`:
#
#   - uses: ./.github/actions/build-website
#     with:
#       output-directory: build/website
#
# Produces:
#   <output-directory>/             static files copied from website/
#   <output-directory>/examples/    generated from the zcap-spec snapshot in fixtures.ts
#   <output-directory>/lib/         the library as browser ES modules, importable from any page
#   <output-directory>/app/         the page scripts: the homepage (renders ?url=) and /diff/
#   <output-directory>/diff/        experimental: compares the examples of two spec versions
#
# The API docs are a separate action (build-docs); gh-pages.yml puts them at
# <output-directory>/docs/. Knows nothing about where the output goes.
name: Build website
description: Build the website from website/ (plus generated examples and browser modules) into an output directory.

inputs:
  output-directory:
    description: Directory to write the built website into, relative to the workspace.
    required: true
  site-url:
    description: >-
      Absolute URL the site will be served from, used in the homepage's import
      snippet. Defaults to the GitHub Pages URL derived from package.json.
    required: false
    default: ""
  node-version:
    description: Node.js version. Must support type stripping (>= 22.18).
    required: false
    default: "22"

outputs:
  output-directory:
    description: The directory the website was built into.
    value: ${{ inputs.output-directory }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # For TypeScript, which compiles /lib/.
    - shell: bash
      run: npm ci

    # Inputs are passed through env, never interpolated into the script, so a
    # value cannot inject shell.
    - shell: bash
      env:
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        SITE_URL: ${{ inputs.site-url }}
      run: node website/build.ts --clean --out "$OUTPUT_DIRECTORY" --site-url "$SITE_URL"
