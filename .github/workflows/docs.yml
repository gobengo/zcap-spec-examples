# Check that the TypeDoc API docs build (type-check included).
#
# This only builds; it does not publish. Publishing to GitHub Pages happens in
# gh-pages.yml, which uses the same .github/actions/build-docs action.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/build-docs
        with:
          # Matches "out" in etc/typedoc.json.
          output-directory: docs
